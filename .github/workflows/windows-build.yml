name: Windows tests and executable

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run end-to-end and safety tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone Windows executable
        run: >-
          python -m PyInstaller --noconfirm --clean --noconsole --onefile
          --name LaptopDoctor
          --add-data "laptop_doctor/web;laptop_doctor/web"
          --collect-all webview main.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LaptopDoctor-Windows-x64
          path: dist/LaptopDoctor.exe
          if-no-files-found: error
          retention-days: 30
